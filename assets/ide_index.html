<!DOCTYPE html>
<html>

<head>
    <title>System Manager Pro - Web IDE</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <style>
        :root {
            --bg: #0d1117;
            --sidebar: #161b22;
            --accent: #238636;
            --text: #c9d1d9;
            --border: #30363d;
        }

        body,
        html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* Navigation Styles */
        #main-nav {
            display: flex;
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            height: 50px;
            align-items: center;
            justify-content: space-around;
        }

        .nav-item {
            cursor: pointer;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            color: #8b949e;
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }

        .nav-item.active {
            color: var(--text);
            border-bottom: 2px solid var(--accent);
        }

        .nav-item:hover {
            color: var(--text);
        }

        /* Pages Layout */
        .page {
            display: none;
            height: calc(100% - 50px);
            overflow-y: auto;
        }

        .page.active {
            display: block;
        }

        /* Dashboard Styles */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .card h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #8b949e;
        }

        .val {
            font-size: 32px;
            font-weight: bold;
            color: var(--accent);
        }

        /* Logs Styles */
        #log-container {
            background: #000;
            color: #0f0;
            padding: 20px;
            font-family: monospace;
            height: 100%;
            border: none;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Settings Styles */
        .settings-form {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background: var(--sidebar);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--border);
        }

        /* IDE Styles (PYCHARM FEEL) */
        #ide-page {
            display: none;
            height: calc(100% - 50px);
            flex-direction: column;
            overflow: hidden;
        }

        #ide-page.active {
            display: flex;
        }

        #ide-toolbar {
            padding: 5px 10px;
            background: #252526;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid #333;
        }

        #ide-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #ide-sidebar {
            width: 220px;
            border-right: 1px solid #333;
            background: #252526;
            overflow-y: auto;
            font-size: 13px;
        }

        #editor-container {
            flex: 1;
            position: relative;
        }

        #ide-bottom {
            height: 150px;
            background: #000;
            border-top: 1px solid #333;
            padding: 5px 10px;
            font-family: monospace;
            font-size: 12px;
            overflow-y: auto;
        }

        .file-item {
            padding: 4px 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .file-item:hover {
            background: #2a2d2e;
        }

        .file-item.active {
            background: #37373d;
            color: #007acc;
        }

        button {
            background: #238636;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }

        button:hover {
            background: #2ea043;
        }

        button.danger {
            background: #da3633;
        }
    </style>
</head>

<body>
    <nav id="main-nav">
        <div class="nav-item active" onclick="showPage('dashboard')">Dashbord</div>
        <div class="nav-item" onclick="showPage('logs')">Loglar</div>
        <div class="nav-item" onclick="showPage('settings')">Sozlamalar</div>
        <div class="nav-item" onclick="showPage('ide')">PyCharm IDE</div>
    </nav>

    <!-- Page 1: Dashboard -->
    <div id="dashboard" class="page active">
        <div class="card-grid">
            <div class="card">
                <h2>CPU Yuklanishi</h2>
                <div id="cpu-val" class="val">--%</div>
            </div>
            <div class="card">
                <h2>RAM Ishlatilishi</h2>
                <div id="ram-val" class="val">--%</div>
            </div>
            <div class="card">
                <h2>Server Vaqti</h2>
                <div id="time-val" class="val">--:--</div>
            </div>
        </div>
        <div style="padding: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="controlBot('start')">▶ Botni Yoqish</button>
            <button class="danger" onclick="controlBot('stop')">⏹ Botni To'xtatish</button>
            <button style="background: #f59e0b;" onclick="controlBot('restart')">🔄 Restart</button>
        </div>
    </div>

    <!-- Page 2: Logs -->
    <div id="logs" class="page">
        <div id="log-container">>>> Loglarni kutmoqda...</div>
        <button style="position: fixed; bottom: 70px; right: 20px; z-index: 100;" onclick="updateLogs()">🔄
            Yangilash</button>
    </div>

    <!-- Page 3: Settings -->
    <div id="settings" class="page">
        <div class="settings-form">
            <h3>Tizim Sozlamalari</h3>
            <div class="setting-item">
                <span>Avto-start (Windows ishga tushganda)</span>
                <input type="checkbox" id="auto-start-check">
            </div>
            <div class="setting-item">
                <span>Resurslar uchun Ogohlantirish (Alerts)</span>
                <input type="checkbox" id="alerts-check">
            </div>
            <button style="margin-top: 20px; width: 100%;" onclick="saveSettings()">Sozlamalarni Saqlash</button>
        </div>
    </div>

    <!-- Page 4: IDE (Full PyCharm layout) -->
    <div id="ide" class="page" style="overflow: hidden;">
        <div id="ide-toolbar">
            <button onclick="saveFile()">💾 Saqlash</button>
            <button onclick="runScript()" style="background: #f59e0b;">▶ Run Python</button>
            <button onclick="gitPush()" style="background: #1d4ed8;">🚀 GitHub Sync (Push)</button>
            <span id="current-file"
                style="margin-left: 20px; font-size: 13px; color: #aaa; align-self: center;">Tanlanmagan fayl</span>
        </div>
        <div id="ide-content">
            <div id="ide-sidebar">
                <div
                    style="padding: 8px; font-weight: bold; font-size: 11px; text-transform: uppercase; color: #6e7681;">
                    Project Explorer</div>
                <div id="file-list"></div>
            </div>
            <div id="editor-container"></div>
        </div>
        <div id="ide-bottom">
            <div style="background: #333; padding: 2px 10px; font-size: 11px; color: #aaa;">IDE Terminal & Push Result
            </div>
            <div id="ide-terminal"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        const TOKEN = "nurali_dev_2026";
        let editor, activeFile = null;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active');
            if (id === 'ide' && editor) editor.layout();
        }

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' } });
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "# PyCharm IDE Mobile Edition\n# Biror faylni tahrirlash uchun tanlang.",
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false }
            });
            loadFiles();
            setInterval(updateDashboard, 3000);
            updateDashboard();
        });

        async function updateDashboard() {
            try {
                const res = await fetch('/api/system/status', { headers: { 'x-token': TOKEN } });
                const data = await res.json();
                document.getElementById('cpu-val').innerText = data.cpu + '%';
                document.getElementById('ram-val').innerText = data.ram + '%';
                document.getElementById('time-val').innerText = data.time;
            } catch (e) { }
        }

        async function updateLogs() {
            try {
                const res = await fetch('/api/system/logs', { headers: { 'x-token': TOKEN } });
                const data = await res.json();
                const container = document.getElementById('log-container');
                container.innerText = data.logs;
                container.scrollTop = container.scrollHeight;
            } catch (e) { }
        }

        async function controlBot(cmd) {
            logIDE(`Buyruq yuborilmoqda: ${cmd}...`);
            const res = await fetch('/api/system/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-token': TOKEN },
                body: JSON.stringify({ command: cmd })
            });
            const data = await res.json();
            alert(data.message);
        }

        async function runScript() {
            if (!activeFile) return alert("Faylni tanlang!");
            logIDE(`Running ${activeFile}...`);
            // This is a placeholder for actual script execution if we add it to the API
            alert("Script running initiated on server console.");
        }

        async function loadFiles() {
            const res = await fetch('/api/files', { headers: { 'x-token': TOKEN } });
            const files = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            files.forEach(f => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerText = '🐍 ' + f;
                div.onclick = () => openFile(f, div);
                list.appendChild(div);
            });
        }

        async function openFile(path, el) {
            document.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            const res = await fetch(`/api/file/${path}`, { headers: { 'x-token': TOKEN } });
            const data = await res.json();
            activeFile = path;
            document.getElementById('current-file').innerText = path;
            let lang = path.endsWith('.py') ? 'python' : (path.endsWith('.html') ? 'html' : 'plaintext');
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(data.content);
        }

        async function saveFile() {
            if (!activeFile) return;
            const res = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-token': TOKEN },
                body: JSON.stringify({ path: activeFile, content: editor.getValue() })
            });
            if (res.ok) logIDE("Fayl saqlandi muvaffaqiyatli!");
        }

        async function gitPush() {
            const msg = prompt("Commit uchun xabar:");
            if (!msg) return;
            logIDE("GitHub Pushing...");
            const res = await fetch('/api/git/push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-token': TOKEN },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            logIDE(data.status === 'success' ? "✅ OK: " + data.output : "❌ Xato: " + data.message);
        }

        function logIDE(msg) {
            const t = document.getElementById('ide-terminal');
            t.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            t.scrollTop = t.scrollHeight;
        }
    </script>
</body>

</html>
