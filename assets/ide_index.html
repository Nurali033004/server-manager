<!DOCTYPE html>
<html>
<head>
    <title>System Manager Cloud IDE</title>
    <meta charset="utf-8">
    <link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/editor/editor.main.min.css">
    <style>
        body, html { height: 100%; margin: 0; padding: 0; background: #1e1e1e; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #container { display: flex; height: 100%; }
        #sidebar { width: 250px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #editor-container { flex: 1; position: relative; }
        #toolbar { padding: 10px; background: #252526; display: flex; gap: 10px; border-bottom: 1px solid #333; }
        #file-list { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .file-item { padding: 5px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-item:hover { background: #2a2d2e; }
        .file-item.active { background: #37373d; color: #007acc; }
        button { background: #0e639c; color: white; border: none; padding: 5px 12px; cursor: pointer; border-radius: 2px; }
        button:hover { background: #1177bb; }
        #terminal { height: 150px; background: #000; border-top: 1px solid #333; padding: 10px; font-family: monospace; font-size: 12px; overflow-y: auto; color: #0f0; }
        .status-bar { padding: 5px 10px; background: #007acc; font-size: 12px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div id="toolbar">
        <button onclick="saveFile()">💾 Saqlash</button>
        <button onclick="gitPush()" style="background: #10b981;">🚀 GitHub Push</button>
        <span id="current-file" style="margin-left: 20px; font-size: 13px; color: #aaa; align-self: center;">Tanlanmagan</span>
    </div>
    <div id="container">
        <div id="sidebar">
            <div style="padding: 10px; font-weight: bold; border-bottom: 1px solid #333;">Fayllar</div>
            <div id="file-list">Yuklanmoqda...</div>
        </div>
        <div style="display: flex; flex-direction: column; flex: 1;">
            <div id="editor-container"></div>
            <div id="terminal">>>> IDE Terminal tayyor...</div>
        </div>
    </div>
    <div class="status-bar">
        <span id="sys-status">CPU: --% | RAM: --%</span>
        <span>Secure Session: Active</span>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script>
        const TOKEN = "nurali_dev_2026";
        let editor;
        let activeFile = null;

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: "# Biror faylni tanlang...",
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true
            });
            loadFiles();
            updateStatus();
            setInterval(updateStatus, 5000);
        });

        async function loadFiles() {
            const res = await fetch('/api/files', { headers: { 'x-token': TOKEN }});
            const files = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';
            files.forEach(f => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerText = f;
                div.onclick = () => openFile(f, div);
                list.appendChild(div);
            });
        }

        async function openFile(path, el) {
            document.querySelectorAll('.file-item').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            
            const res = await fetch(`/api/file/${path}`, { headers: { 'x-token': TOKEN }});
            const data = await res.json();
            
            activeFile = path;
            document.getElementById('current-file').innerText = path;
            
            // Guess language
            let lang = 'plaintext';
            if (path.endsWith('.py')) lang = 'python';
            if (path.endsWith('.html')) lang = 'html';
            if (path.endsWith('.bat') || path.endsWith('.ps1')) lang = 'powershell';
            
            monaco.editor.setModelLanguage(editor.getModel(), lang);
            editor.setValue(data.content);
            log(`Fayl ochildi: ${path}`);
        }

        async function saveFile() {
            if (!activeFile) return alert("Faylni tanlang!");
            const content = editor.getValue();
            const res = await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-token': TOKEN },
                body: JSON.stringify({ path: activeFile, content: content })
            });
            if (res.ok) {
                log(`Saqlandi: ${activeFile}`);
                alert("Muvaffaqiyatli saqlandi!");
            }
        }

        async function gitPush() {
            const msg = prompt("Commit xabari:");
            if (!msg) return;
            log("GitHub-ga push qilinmoqda...");
            const res = await fetch('/api/git/push', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-token': TOKEN },
                body: JSON.stringify({ message: msg })
            });
            const data = await res.json();
            if (data.status === 'success') {
                log(`✅ Push muvaffaqiyatli!\n${data.output}`);
                alert("GitHub-ga yuborildi!");
            } else {
                log(`❌ Xato: ${data.message}`);
                alert("Xatolik!");
            }
        }

        async function updateStatus() {
            try {
                const res = await fetch('/api/system/status', { headers: { 'x-token': TOKEN }});
                const data = await res.json();
                document.getElementById('sys-status').innerText = `CPU: ${data.cpu}% | RAM: ${data.ram}%`;
            } catch(e) {}
        }

        function log(msg) {
            const term = document.getElementById('terminal');
            term.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
            term.scrollTop = term.scrollHeight;
        }
    </script>
</body>
</html>
